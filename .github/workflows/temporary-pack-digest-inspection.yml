name: Temporary pack digest inspection

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temporary-pack-digest-inspection.yml"

permissions:
  contents: read

jobs:
  inspect:
    if: github.repository == 'fraware/verifierlab' && github.head_ref == 'fix/pip-audit-unsupported-severity-20261011'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - name: Set up runtime and dependencies
        run: uv sync --extra dev
      - name: Inspect exact public pack contract digests
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          from verifierlab.campaigns.packs import (
              build_expected_public_digests,
              build_profile_sidecar,
              lint_pack,
          )
          from verifierlab.config.campaign import load_campaign

          root = Path("campaigns/packs")
          for letter in "abcde":
              matches = sorted(root.glob(f"pack-{letter}-*.yaml"))
              if len(matches) != 1:
                  raise RuntimeError(f"Ambiguous pack {letter}: {matches}")
              path = matches[0]
              spec, diagnostics = load_campaign(path)
              if diagnostics:
                  print(f"CAMPAIGN_DIAGNOSTICS_{letter}: {diagnostics}")
              expected_file = root / f"pack-{letter}" / "expected-public-digests.json"
              current = json.loads(expected_file.read_text())
              computed = build_expected_public_digests(spec, build_profile_sidecar(spec))
              changed = sorted(
                  key for key in set(current) | set(computed)
                  if current.get(key) != computed.get(key)
              )
              print("DIFF_" + letter + ":" + json.dumps({
                  "changed_fields": changed,
                  "old_campaign_digest": current.get("campaign_digest"),
                  "new_campaign_digest": computed.get("campaign_digest"),
                  "old_content_digest": current.get("content_digest"),
                  "new_content_digest": computed.get("content_digest"),
              }, sort_keys=True), flush=True)
              print("EXPECTED_" + letter + ":" + json.dumps(computed, sort_keys=True), flush=True)
              # Preserve the actual lint result as independent evidence.
              print("LINT_" + letter + ":" + str(lint_pack(path)[0]), flush=True)
          PY
