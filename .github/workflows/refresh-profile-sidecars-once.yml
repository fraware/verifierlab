name: One-shot profile sidecar refresh

on:
  push:
    branches: [assurance/p0-score-fail-closed]
    paths:
      - ".github/workflows/refresh-profile-sidecars-once.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assurance/p0-score-fail-closed
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --extra dev
      - name: Regenerate A-E sidecars from current profile semantics
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          from verifierlab.campaigns.packs import write_pack_sidecars

          root = Path("campaigns/packs")
          for letter in "abcde":
              matches = sorted(root.glob(f"pack-{letter}-*.yaml"))
              if len(matches) != 1:
                  raise SystemExit(f"pack {letter}: expected exactly one YAML, found {len(matches)}")
              write_pack_sidecars(matches[0], force=True)
          PY
      - name: Verify regenerated sidecars before commit
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          from verifierlab.campaigns.packs import verify_pack

          root = Path("campaigns/packs")
          failures = []
          for letter in "abcde":
              path = sorted(root.glob(f"pack-{letter}-*.yaml"))[0]
              ok, diags, _ = verify_pack(path)
              if not ok:
                  failures.append((letter, [d.model_dump(mode="json") for d in diags]))
          if failures:
              raise SystemExit(repr(failures))
          PY
      - name: Commit regenerated derived artifacts
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "repo-maintenance"
          git config user.email "repo-maintenance@users.noreply.github.com"
          git add campaigns/packs/pack-a campaigns/packs/pack-b campaigns/packs/pack-c campaigns/packs/pack-d campaigns/packs/pack-e
          git diff --cached --quiet && exit 1
          git commit -m "chore(packs): refresh verifier profile sidecars"
          git push origin HEAD:assurance/p0-score-fail-closed
