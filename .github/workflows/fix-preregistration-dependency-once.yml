name: One-shot preregistration dependency repair

on:
  push:
    branches: [assurance/p0-preregistered-estimands]
    paths:
      - ".github/workflows/fix-preregistration-dependency-once.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assurance/p0-preregistered-estimands
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --extra dev
      - name: Apply dependency and validation corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/verifierlab/config/campaign.py",
              "from verifierlab.statistics.preregistration import AnalysisPreregistration\n",
              "from verifierlab.config.preregistration import AnalysisPreregistration\n",
          )
          replace_once(
              "src/verifierlab/config/campaign.py",
              '''    if spec.stats_plan.multiple_comparison_policy == "pre_registered_primary":\n        diags.append(\n            Diagnostic(\n                code="VALAB.CAMPAIGN.PRIMARY_FAMILY_UNSUPPORTED",\n                severity=DiagnosticSeverity.ERROR,\n                message=(\n                    "pre_registered_primary requires an explicit estimand family compiler; "\n                    "use none/bonferroni until that implementation exists"\n                ),\n                path="stats_plan.multiple_comparison_policy",\n            )\n        )\n''',
              '''    if (\n        spec.stats_plan.multiple_comparison_policy == "pre_registered_primary"\n        and spec.stats_plan.preregistration is None\n    ):\n        diags.append(\n            Diagnostic(\n                code="VALAB.CAMPAIGN.PREREGISTRATION_REQUIRED",\n                severity=DiagnosticSeverity.ERROR,\n                message=(\n                    "pre_registered_primary requires an explicit content-bound "\n                    "stats_plan.preregistration"\n                ),\n                path="stats_plan.preregistration",\n            )\n        )\n''',
          )
          replace_once(
              "src/verifierlab/statistics/preregistered.py",
              "from verifierlab.statistics.preregistration import AnalysisPreregistration, EstimandSpec\n",
              "from verifierlab.config.preregistration import AnalysisPreregistration, EstimandSpec\n",
          )

          Path("src/verifierlab/statistics/preregistration.py").write_text(
              '''"""Compatibility exports for content-bound preregistration schemas."""\n\nfrom verifierlab.config.preregistration import (\n    AnalysisPreregistration,\n    EstimandMetric,\n    EstimandRole,\n    EstimandSpec,\n    InferenceMode,\n    InterpretationDirection,\n    IntervalMethod,\n)\n\n__all__ = [\n    "AnalysisPreregistration",\n    "EstimandMetric",\n    "EstimandRole",\n    "EstimandSpec",\n    "InferenceMode",\n    "InterpretationDirection",\n    "IntervalMethod",\n]\n''',
              encoding="utf-8",
          )

          test_path = Path("tests/test_preregistered_estimands.py")
          text = test_path.read_text(encoding="utf-8")
          text = text.replace(
              "from verifierlab.config.campaign import StatsPlan\n",
              "from verifierlab.config.campaign import StatsPlan, load_campaign_dict\n",
              1,
          )
          append = '''\n\ndef _campaign_payload(plan: StatsPlan) -> dict[str, object]:\n    return {\n        "schema_version": "1",\n        "name": "registered-analysis",\n        "pinned_versions": {"verifierlab": "0.2.0rc2", "campaign": "registered@1"},\n        "access_model": "black-box",\n        "budget": {"max_queries": 10, "overrun_policy": "stop"},\n        "environment": {"kind": "fake", "ref": "fake"},\n        "verifier": {"kind": "python", "ref": "examples.refunds.verifier:grade"},\n        "ground_truth": {"provider": "examples.refunds.gt:label"},\n        "stats_plan": plan.model_dump(mode="json"),\n    }\n\n\ndef test_campaign_semantics_accept_registered_primary_family() -> None:\n    spec, diagnostics = load_campaign_dict(_campaign_payload(_plan(_registration())))\n    assert spec is not None\n    assert not [d for d in diagnostics if d.code == "VALAB.CAMPAIGN.PREREGISTRATION_REQUIRED"]\n\n\ndef test_campaign_semantics_reject_primary_family_without_registration() -> None:\n    spec, diagnostics = load_campaign_dict(_campaign_payload(_plan()))\n    assert spec is not None\n    matching = [d for d in diagnostics if d.code == "VALAB.CAMPAIGN.PREREGISTRATION_REQUIRED"]\n    assert len(matching) == 1\n    assert matching[0].path == "stats_plan.preregistration"\n'''
          if "test_campaign_semantics_accept_registered_primary_family" in text:
              raise SystemExit("campaign semantic tests already present")
          test_path.write_text(text + append, encoding="utf-8")
          PY
      - name: Normalize and test
        run: |
          uv run ruff format src/verifierlab/config/preregistration.py src/verifierlab/config/campaign.py src/verifierlab/statistics/preregistration.py src/verifierlab/statistics/preregistered.py tests/test_preregistered_estimands.py
          uv run ruff check src tests
          uv run mypy
          uv run pytest tests/test_preregistered_estimands.py tests/test_stats_plan_controls.py -q
          uv run valab --help >/dev/null
      - name: Commit corrected dependency layer
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "repo-maintenance"
          git config user.email "repo-maintenance@users.noreply.github.com"
          git add src/verifierlab/config/preregistration.py src/verifierlab/config/campaign.py src/verifierlab/statistics/preregistration.py src/verifierlab/statistics/preregistered.py tests/test_preregistered_estimands.py
          git diff --cached --quiet && exit 1
          git commit -m "fix(stats): remove preregistration import cycle"
          git push origin HEAD:assurance/p0-preregistered-estimands
