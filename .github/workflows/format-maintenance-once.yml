name: Format maintenance branch once

on:
  push:
    branches:
      - maintenance/ci-lint-baseline

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/ci-lint-baseline
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - name: Install Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Apply repository formatter
        run: uv run ruff format src tests

      - name: Commit formatter output only
        shell: bash
        run: |
          set -euo pipefail
          git add src tests
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: apply ruff formatting baseline"
          git push origin HEAD:maintenance/ci-lint-baseline
