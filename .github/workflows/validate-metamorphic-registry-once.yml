name: Validate registered metamorphic evidence

on:
  push:
    branches: [research/metamorphic-registry]
    paths:
      - ".github/workflows/validate-metamorphic-registry-once.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/metamorphic-registry
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --extra dev
      - name: Enforce fail-closed evaluation and validator shape
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/verifierlab/statistics/metamorphic.py")
          text = path.read_text(encoding="utf-8")
          old_order = '''    gt_before = bool(is_valid(original))\n    gt_after = bool(is_valid(transformed))\n    verifier_before = normalize_decision(verifier(original)).accepted\n    verifier_after = normalize_decision(verifier(transformed)).accepted\n\n    if gt_before != gt_after:\n        counterexample = _counterexample(\n            kind="ground_truth_invariance_violation",\n            spec=spec,\n            source_unit_digest=unit_digest,\n            original_digest=original_digest,\n            transformed_digest=transformed_digest,\n            gt_before=gt_before,\n            gt_after=gt_after,\n            verifier_before=verifier_before,\n            verifier_after=verifier_after,\n        )\n        evidence = MetamorphicCaseEvidence(\n            transformation=spec,\n            verifier_profile_digest=verifier_profile_digest,\n            source_unit_digest=unit_digest,\n            original_digest=original_digest,\n            transformed_digest=transformed_digest,\n            gt_before=gt_before,\n            gt_after=gt_after,\n            gt_invariant=False,\n            verifier_before=verifier_before,\n            verifier_after=verifier_after,\n            verifier_invariant=None,\n            status="invalid_transform",\n            counterexample=counterexample,\n        )\n        if fail_on_invalid_transform:\n            raise InvalidMetamorphicTransformation(evidence)\n        return evidence\n\n    if verifier_before is None or verifier_after is None:\n'''
          new_order = '''    gt_before = bool(is_valid(original))\n    gt_after = bool(is_valid(transformed))\n\n    if gt_before != gt_after:\n        counterexample = _counterexample(\n            kind="ground_truth_invariance_violation",\n            spec=spec,\n            source_unit_digest=unit_digest,\n            original_digest=original_digest,\n            transformed_digest=transformed_digest,\n            gt_before=gt_before,\n            gt_after=gt_after,\n            verifier_before=None,\n            verifier_after=None,\n        )\n        evidence = MetamorphicCaseEvidence(\n            transformation=spec,\n            verifier_profile_digest=verifier_profile_digest,\n            source_unit_digest=unit_digest,\n            original_digest=original_digest,\n            transformed_digest=transformed_digest,\n            gt_before=gt_before,\n            gt_after=gt_after,\n            gt_invariant=False,\n            verifier_before=None,\n            verifier_after=None,\n            verifier_invariant=None,\n            status="invalid_transform",\n            counterexample=counterexample,\n        )\n        if fail_on_invalid_transform:\n            raise InvalidMetamorphicTransformation(evidence)\n        return evidence\n\n    verifier_before = normalize_decision(verifier(original)).accepted\n    verifier_after = normalize_decision(verifier(transformed)).accepted\n\n    if verifier_before is None or verifier_after is None:\n'''
          if text.count(old_order) != 1:
              raise SystemExit("expected one metamorphic evaluation block")
          text = text.replace(old_order, new_order, 1)

          old_validator = '''        if self.status in {"verifier_violation", "invalid_transform", "indeterminate"}:\n            if self.counterexample is None:\n                raise ValueError(f"{self.status} requires typed counterexample evidence")\n'''
          new_validator = '''        if (\n            self.status in {"verifier_violation", "invalid_transform", "indeterminate"}\n            and self.counterexample is None\n        ):\n            raise ValueError(f"{self.status} requires typed counterexample evidence")\n'''
          if text.count(old_validator) != 1:
              raise SystemExit("expected one counterexample validator block")
          path.write_text(text.replace(old_validator, new_validator, 1), encoding="utf-8")
          PY
      - name: Normalize and validate registered metamorphic evidence
        run: |
          uv run ruff format src/verifierlab/statistics/metamorphic.py tests/test_metamorphic_registry.py
          uv run ruff check src/verifierlab/statistics/metamorphic.py tests/test_metamorphic_registry.py
          uv run ruff format --check src/verifierlab/statistics/metamorphic.py tests/test_metamorphic_registry.py
          uv run mypy src/verifierlab/statistics/metamorphic.py tests/test_metamorphic_registry.py
          uv run pytest tests/test_metamorphic_registry.py tests/test_milestone_d.py tests/test_packs.py tests/test_score_decision_fail_closed.py -q
      - name: Commit validated metamorphic evidence
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "repo-maintenance"
          git config user.email "repo-maintenance@users.noreply.github.com"
          git add src/verifierlab/statistics/metamorphic.py tests/test_metamorphic_registry.py
          git diff --cached --quiet && exit 1
          git commit -m "feat(stats): enforce registered metamorphic evidence"
          git push origin HEAD:research/metamorphic-registry
