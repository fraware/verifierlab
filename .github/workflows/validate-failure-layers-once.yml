name: Validate failure-layer attribution

on:
  push:
    branches: [research/failure-layer-taxonomy]
    paths:
      - ".github/workflows/validate-failure-layers-once.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/failure-layer-taxonomy
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --extra dev
      - name: Repair strict negative-fixture typing
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_failure_layers.py")
          text = path.read_text(encoding="utf-8")
          old = '''    with pytest.raises(ValueError, match="exactly one"):\n        FailureLayerAssessment(\n            **common,\n            status="attributed",\n            layers=(FailureLayer.IMPLEMENTATION, FailureLayer.SPECIFICATION),\n        )\n    with pytest.raises(ValueError, match="at least two"):\n        FailureLayerAssessment(\n            **common,\n            status="mixed",\n            layers=(FailureLayer.IMPLEMENTATION,),\n        )\n    with pytest.raises(ValueError, match="cannot assert"):\n        FailureLayerAssessment(\n            **common,\n            status="indeterminate",\n            layers=(FailureLayer.IMPLEMENTATION,),\n        )\n    with pytest.raises(ValueError, match="unique"):\n        FailureLayerAssessment(\n            **common,\n            status="mixed",\n            layers=(FailureLayer.SPECIFICATION, FailureLayer.SPECIFICATION),\n        )\n'''
          new = '''    with pytest.raises(ValueError, match="exactly one"):\n        FailureLayerAssessment.model_validate(\n            {\n                **common,\n                "status": "attributed",\n                "layers": (FailureLayer.IMPLEMENTATION, FailureLayer.SPECIFICATION),\n            }\n        )\n    with pytest.raises(ValueError, match="at least two"):\n        FailureLayerAssessment.model_validate(\n            {\n                **common,\n                "status": "mixed",\n                "layers": (FailureLayer.IMPLEMENTATION,),\n            }\n        )\n    with pytest.raises(ValueError, match="cannot assert"):\n        FailureLayerAssessment.model_validate(\n            {\n                **common,\n                "status": "indeterminate",\n                "layers": (FailureLayer.IMPLEMENTATION,),\n            }\n        )\n    with pytest.raises(ValueError, match="unique"):\n        FailureLayerAssessment.model_validate(\n            {\n                **common,\n                "status": "mixed",\n                "layers": (FailureLayer.SPECIFICATION, FailureLayer.SPECIFICATION),\n            }\n        )\n'''
          if text.count(old) != 1:
              raise SystemExit("expected one invalid-shape fixture block")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Normalize and validate failure layers
        run: |
          uv run ruff format src/verifierlab/exploits/layers.py src/verifierlab/exploits/__init__.py tests/test_failure_layers.py
          uv run ruff check src/verifierlab/exploits/layers.py src/verifierlab/exploits/__init__.py tests/test_failure_layers.py
          uv run ruff format --check src/verifierlab/exploits/layers.py src/verifierlab/exploits/__init__.py tests/test_failure_layers.py
          uv run mypy src/verifierlab/exploits/layers.py src/verifierlab/exploits/__init__.py tests/test_failure_layers.py
          uv run pytest tests/test_failure_layers.py tests/test_phase_d_exploits_repair.py tests/test_milestone_d.py -q
      - name: Commit validated failure layers
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "repo-maintenance"
          git config user.email "repo-maintenance@users.noreply.github.com"
          git add src/verifierlab/exploits/layers.py src/verifierlab/exploits/__init__.py tests/test_failure_layers.py
          git diff --cached --quiet && exit 1
          git commit -m "feat(exploits): enforce evidence-linked failure layers"
          git push origin HEAD:research/failure-layer-taxonomy
