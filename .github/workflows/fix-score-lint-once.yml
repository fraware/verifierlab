name: Fix score branch lint once

on:
  push:
    branches:
      - assurance/p0-score-fail-closed

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assurance/p0-score-fail-closed
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --extra dev
      - name: Apply Ruff import fix to profile-binding regression
        run: |
          uv run ruff check --fix tests/test_campaign_profile_binding.py
          uv run ruff format tests/test_campaign_profile_binding.py
      - name: Commit only the corrected test file
        shell: bash
        run: |
          set -euo pipefail
          git add tests/test_campaign_profile_binding.py
          if git diff --cached --quiet; then
            echo "No lint changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(test): apply ruff import ordering"
          git push origin HEAD:assurance/p0-score-fail-closed
