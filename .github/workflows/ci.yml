name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Ruff
        run: uv run ruff check src tests

      - name: Mypy
        run: uv run mypy

      - name: Pytest
        run: uv run pytest

      - name: Base import graph has no heavy ML deps
        run: uv run python scripts/check_base_imports.py

      - name: Fake campaign smoke
        run: |
          uv run valab init --force
          uv run valab campaign run campaigns/fake-smoke.yaml --threads --format json

      - name: Refund tutorial smoke (offline)
        run: |
          uv run valab inspect examples.refunds.verifier:grade --format json
          uv run valab run campaigns/refund-ci-smoke.yaml --threads --format json
          RUN_DIR=$(ls -d .valab/runs/run-* | head -n 1)
          uv run valab report builds "$RUN_DIR" --format json
