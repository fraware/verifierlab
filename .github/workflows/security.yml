name: Security

# CodeQL on PR/push + dependency audit / SBOM.
# High/critical pip-audit findings hard-fail on main, release branches, and
# annotated release tags (WP-18). Time-bounded waivers use security/waivers/.

on:
  push:
    branches: [main, release/0.2-rc, integration/final-assurance]
    tags: ["v*"]
  pull_request:
    branches: [main, release/0.2-rc, integration/final-assurance]
  release:
    types: [published]
  schedule:
    - cron: "42 7 * * 3"
  workflow_dispatch:
    inputs:
      fail_audit:
        description: "Hard-fail on high/critical pip-audit findings"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  codeql:
    name: CodeQL (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"

  worker-secret-scan:
    name: Worker tree secret/leak scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --extra dev
      - name: Scan docker/worker
        run: uv run python scripts/scan_worker_secrets.py

  audit-sbom:
    name: Dependency audit + SBOM
    runs-on: ubuntu-latest
    # Hard-fail path on main/release/tags; advisory elsewhere unless dispatch requests fail.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'release' ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/release/0.2-rc' ||
      github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Resolve audit fail posture
        id: posture
        shell: bash
        run: |
          set -euo pipefail
          HARD=false
          if [[ "${{ github.ref }}" == refs/tags/v* ]] \
            || [[ "${{ github.event_name }}" == "release" ]] \
            || [[ "${{ github.ref }}" == refs/heads/main ]] \
            || [[ "${{ github.ref }}" == refs/heads/release/0.2-rc ]] \
            || [[ "${{ github.base_ref }}" == "main" ]] \
            || [[ "${{ github.base_ref }}" == "release/0.2-rc" ]]; then
            HARD=true
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.fail_audit }}" == "true" ]]; then
              HARD=true
            else
              HARD=false
            fi
          fi
          echo "hard_fail=${HARD}" >> "$GITHUB_OUTPUT"
          echo "Audit hard_fail=${HARD}"

      - name: Dependency audit (pip-audit)
        id: audit
        continue-on-error: ${{ steps.posture.outputs.hard_fail != 'true' }}
        run: |
          uv pip install pip-audit
          # Fail on HIGH/CRITICAL for protected lines; advisory otherwise.
          if [[ "${{ steps.posture.outputs.hard_fail }}" == "true" ]]; then
            uv run pip-audit --desc --severity-level=high
          else
            uv run pip-audit --desc
          fi

      - name: Generate SBOM (CycloneDX)
        run: |
          uv pip install cyclonedx-bom
          uv run cyclonedx-py environment -o sbom.cdx.json
          test -s sbom.cdx.json
          echo "Worker image SBOM hook: syft docker/worker -o cyclonedx-json > worker-sbom.cdx.json"

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: verifierlab-sbom
          path: sbom.cdx.json
