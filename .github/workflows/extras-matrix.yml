name: Extras matrix

# Scheduled / on-demand extras (gym, inspect, harbor, …). Release subset is
# required; missing SDKs skip with an explicit reason (never stub pass).

on:
  schedule:
    - cron: "17 6 * * 1" # weekly Monday 06:17 UTC
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  extras:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - extra: gym
            marker: gym
            python: "3.12"
            release_required: true
          - extra: inspect
            marker: inspect
            python: "3.12"
            release_required: true
          - extra: harbor
            marker: harbor
            python: "3.12"
            release_required: false
          - extra: openenv
            marker: openenv
            python: "3.12"
            release_required: false
          - extra: objectstore
            marker: objectstore
            python: "3.12"
            release_required: false
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Sync with extra
        run: uv sync --extra dev --extra ${{ matrix.extra }}

      - name: Pytest marked suite
        continue-on-error: ${{ matrix.release_required == false }}
        run: uv run pytest -m "${{ matrix.marker }}" -q

  pack-heavy:
    name: Packs C/D/E (optional / nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --extra dev
      - name: Run heavy science packs
        run: uv run pytest tests/test_packs.py -m pack_heavy -q
