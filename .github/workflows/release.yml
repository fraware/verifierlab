name: Release

# Fail-closed signed-tag release pipeline. Builds wheel/sdist once, checksums,
# CycloneDX SBOM, release-manifest.json, and attaches artifacts to a GitHub
# Release. Trusted PyPI publish runs only when OIDC / environment is configured.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      skip_publish:
        description: "Skip PyPI trusted publish even if configured"
        required: false
        type: boolean
        default: true
      ref:
        description: "Optional git ref to checkout (defaults to triggering ref)"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate-tag:
    name: Tag / dispatch gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      is_tag: ${{ steps.meta.outputs.is_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Resolve version metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          IS_TAG=false
          TAG=""
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            IS_TAG=true
            TAG="${GITHUB_REF_NAME}"
          elif [[ -n "${{ inputs.ref }}" && "${{ inputs.ref }}" == v* ]]; then
            IS_TAG=true
            TAG="${{ inputs.ref }}"
          fi
          VERSION=$(python3 - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "is_tag=${IS_TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved version=${VERSION} tag=${TAG:-<none>} is_tag=${IS_TAG}"

      - name: Enforce signed annotated release tag
        if: steps.meta.outputs.is_tag == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          EXPECTED="v${{ steps.meta.outputs.version }}"

          if [[ "$(git cat-file -t "refs/tags/${TAG}")" != "tag" ]]; then
            echo "::error::Release tag ${TAG} must be an annotated tag."
            exit 1
          fi

          if [[ "$TAG" != "$EXPECTED" ]]; then
            echo "::error::Release tag ${TAG} does not match package version ${EXPECTED}."
            exit 1
          fi

          # Cryptographic authenticity is a release invariant, not advisory metadata.
          git verify-tag "$TAG"

          # Release tags must point to history reachable from the protected main line.
          git fetch origin main --no-tags
          TAG_COMMIT=$(git rev-parse "${TAG}^{}")
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "::error::Release tag ${TAG} (${TAG_COMMIT}) is not reachable from origin/main."
            exit 1
          fi

          echo "OK: signed annotated tag ${TAG} matches ${EXPECTED} and is reachable from origin/main."

  smoke:
    name: Smoke (${{ matrix.os }} / py${{ matrix.python-version }})
    needs: gate-tag
    runs-on: ${{ matrix.os }}
    # Windows path smoke remains soft-fail; Windows is not release-qualified
    # (see docs/support-matrix.md). Do not treat a green Windows soft-fail as
    # stable support.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Core pytest
        shell: bash
        run: uv run pytest -m "not pack_heavy" -q

      - name: Thread + process smoke
        shell: bash
        run: |
          uv run valab init --force
          uv run valab campaign run campaigns/fake-smoke.yaml --threads --format json
          uv run valab campaign run campaigns/fake-smoke.yaml --processes --format json

      - name: Separation checks
        shell: bash
        run: >
          uv run pytest
          tests/test_acceptance_gates.py::TestGate1Isolation
          tests/test_docker_trust_boundaries.py
          -q

  build-artifacts:
    name: Build wheel / sdist / manifest
    needs: [gate-tag, smoke]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.gate-tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Build wheel and sdist
        env:
          SOURCE_DATE_EPOCH: "1700000000"
        run: |
          set -euo pipefail
          rm -rf dist
          # Reproducible-ish builds: fixed SOURCE_DATE_EPOCH for release artifacts.
          uv build --out-dir dist
          ls -la dist
          # Content-hash compare helper: record digests immediately after build.
          cd dist
          sha256sum verifierlab-* | tee BUILD_SHA256.txt

      - name: Fresh wheel install smoke
        run: |
          set -euo pipefail
          WHL=$(ls dist/verifierlab-*.whl | head -n 1)
          uv venv /tmp/vl-release --python 3.12
          uv pip install --python /tmp/vl-release "$WHL"
          /tmp/vl-release/bin/valab --version
          /tmp/vl-release/bin/valab doctor
          /tmp/vl-release/bin/python -c "import verifierlab; print(verifierlab.__version__)"
          /tmp/vl-release/bin/python scripts/check_wheel_contents.py "$WHL"

      - name: Release-qualified adapter smokes
        run: |
          set -euo pipefail
          uv sync --extra dev --extra gym --extra inspect --extra openenv
          uv run pytest -m "gym or inspect or openenv" -q

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum verifierlab-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: SBOM (CycloneDX)
        run: |
          uv pip install cyclonedx-bom
          uv run cyclonedx-py environment -o dist/sbom.cdx.json
          test -s dist/sbom.cdx.json

      - name: Adapter matrix + schema registry + release manifest
        env:
          GITHUB_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.gate-tag.outputs.tag }}
        run: |
          uv run python scripts/generate_adapter_matrix.py
          test -f registry/schema-registry-v1.json
          uv run python scripts/build_release_manifest.py \
            --dist-dir dist \
            --output dist/release-manifest.json \
            --tag "${RELEASE_TAG}" \
            --commit "${GITHUB_SHA}"
          python -c "import json; json.load(open('dist/release-manifest.json', encoding='utf-8'))"
          python -c "import json; m=json.load(open('dist/adapter-matrix.json', encoding='utf-8')); assert m['adapters']"
          python -c "import json; r=json.load(open('registry/schema-registry-v1.json', encoding='utf-8')); assert r['artifacts']"
          cp registry/schema-registry-v1.json dist/schema-registry-v1.json
          # Worker SBOM note (image digest filled when GHCR publish is enabled).
          echo '{"note":"generate worker SBOM via syft after image publish","status":"hook"}' > dist/worker-sbom-hook.json

      - name: Attest build provenance
        if: needs.gate-tag.outputs.is_tag == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/verifierlab-*.whl
            dist/verifierlab-*.tar.gz
            dist/SHA256SUMS.txt
            dist/sbom.cdx.json
            dist/release-manifest.json

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: |
            dist/verifierlab-*.whl
            dist/verifierlab-*.tar.gz
            dist/SHA256SUMS.txt
            dist/BUILD_SHA256.txt
            dist/sbom.cdx.json
            dist/release-manifest.json
            dist/adapter-matrix.json
            dist/schema-registry-v1.json
            dist/worker-sbom-hook.json

  publish-pypi:
    name: Trusted publish (PyPI)
    needs: [gate-tag, build-artifacts]
    if: >
      needs.gate-tag.outputs.is_tag == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.skip_publish == false)
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      # gh-action-pypi-publish validates every file in packages-dir; stage only
      # wheel/sdist so checksums/SBOM/manifest artifacts do not fail the upload.
      - name: Stage PyPI packages only
        run: |
          set -euo pipefail
          mkdir -p pypi-dist
          cp dist/verifierlab-*.whl dist/verifierlab-*.tar.gz pypi-dist/
          ls -la pypi-dist

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi-dist/
          skip-existing: true

  github-release:
    name: GitHub Release attach
    needs: [gate-tag, build-artifacts]
    if: needs.gate-tag.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.gate-tag.outputs.tag }}
        run: |
          set -euo pipefail
          # Defense in depth: never create/update a release if tag verification fails.
          git verify-tag "$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "$TAG" \
              --notes "Automated release artifacts for ${TAG}. See CHANGELOG.md and release-manifest.json." \
              --verify-tag
          fi
