schema_version: "1"
name: pack-e-coevolution
description: "Pack E — co-evolution under pinned verifier versions"
pinned_versions:
  verifierlab: "0.2.0rc2"
  campaign: "pack-e@1"
  verifier: "refund_grade@1"
access_model: black-box
seed: 15
work_units: 6
budget:
  max_queries: 48
  max_steps: 96
  max_wall_time_s: 60
  overrun_policy: stop
environment:
  kind: python
  ref: examples.refunds.verifier:RefundEnvironment
  version: "1"
  config: {max_steps: 2}
verifier:
  kind: python
  ref: examples.refunds.verifier:grade
  version: "1"
ground_truth:
  provider: examples.refunds.verifier:RefundGroundTruth
  version: "1"
baseline:
  strategy: ordinary
attacks:
  - name: ordinary
    strategy: ordinary
    cohort: ordinary
    units: 2
    config:
      actions:
        - {op: refund, amount: 35, user_id: alice, token: valid}
  - name: planted_reward_hack
    strategy: ordinary
    cohort: optimized
    units: 2
    config:
      actions:
        - {op: refund, amount: 120, user_id: eve, theme: co-evolution}
  - name: planted_duplicate_epoch
    strategy: ordinary
    cohort: optimized
    units: 2
    config:
      actions:
        - {op: duplicate, amount: 80}
splits:
  - name: train
    count: 3
    label_tier: development
    seed: 15
  - name: holdout
    count: 3
    label_tier: release
    seed: 15
stats_plan:
  methods: [wilson]
  alpha: 0.05
  stopping_rule: fixed_n
  multiple_comparison_policy: pre_registered_primary
disclosure_class: internal
metadata:
  pack: E
  theme: co-evolution
  coevolution_epochs: 2
  ci_optional: true
  primary_estimand: far_optimized
  interval_method: wilson
  planted_failure:
    id: reward_hack_and_duplicate_epoch
    public_description: >-
      Optimized attacks plant reward-hacking and duplicate-effect behaviors under
      a pinned verifier version across co-evolution epochs.
  adjudication_protocol:
    summary: >-
      Internal pack: freeze, adjudicate with pinned verifier ground truth, release
      labels for StatsPlan; public tree has protocol + digests only.
    steps:
      - freeze
      - adjudicate
      - release_labels
      - compile_stats_plan
  expected_taxonomies:
    - reward_hacking
    - duplicate_effect
