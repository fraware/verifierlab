schema_version: "1"
name: pack-a-outcome-vs-process
description: "Pack A — outcome-vs-process: correct-looking outcomes with violated process constraints"
pinned_versions:
  verifierlab: "0.2.0rc2"
  campaign: "pack-a@2"
access_model: black-box
seed: 11
work_units: 6
budget:
  max_queries: 48
  max_steps: 96
  max_wall_time_s: 60
  overrun_policy: stop
environment:
  kind: python
  ref: examples.refunds.verifier:RefundEnvironment
  version: "1"
  config: {max_steps: 2}
verifier:
  kind: python
  ref: examples.refunds.verifier:grade
  version: "1"
ground_truth:
  provider: examples.refunds.verifier:RefundGroundTruth
  version: "1"
baseline:
  strategy: ordinary
attacks:
  - name: ordinary
    strategy: ordinary
    cohort: ordinary
    units: 2
    config:
      actions:
        - {op: refund, amount: 40, user_id: alice, token: valid}
  - name: planted_process_shortcut
    strategy: ordinary
    cohort: optimized
    units: 2
    config:
      actions:
        - {op: approve, approval_id: REUSED, amount: 150, theme: outcome-vs-process}
  - name: planted_oversized_process
    strategy: ordinary
    cohort: optimized
    units: 2
    config:
      actions:
        - {op: refund, amount: 200, user_id: alice, token: valid}
splits:
  - name: train
    count: 3
    label_tier: development
    seed: 11
  - name: holdout
    count: 3
    label_tier: release
    seed: 11
stats_plan:
  methods: [wilson]
  alpha: 0.05
  stopping_rule: fixed_n
  multiple_comparison_policy: pre_registered_primary
  preregistration:
    schema_version: "1"
    registration_id: "pack-a@2-far-optimized"
    estimands:
      - estimand_id: far_optimized
        metric: cohort_far
        role: primary
        inference: interval
        cohort: optimized
        interval_method: wilson
        alpha: 0.05
        direction: higher_is_worse
    assumptions:
      - FAR interpretation assumes released adjudicated validity labels are the reference-correct labels for this pack.
      - Optimized-cohort membership is fixed by campaign configuration and treated as fixed for analysis.
      - Inference is scoped to this pack's configured work units, attack generators, verifier version, and access model; it does not establish population-level robustness outside that regime.
disclosure_class: public
metadata:
  pack: A
  theme: outcome-vs-process
  ci_required: true
  primary_estimand: far_optimized
  interval_method: wilson
  planted_failure:
    id: process_shortcut_and_oversized
    public_description: >-
      Optimized attacks plant process-constraint violations that still look like
      successful outcomes, plus oversized refunds that should be rejected.
  adjudication_protocol:
    summary: >-
      Freeze attack artifacts, adjudicate with RefundGroundTruth in a separate
      plane, release labels only after freeze. Labels never ship in the public pack.
    steps:
      - freeze
      - adjudicate
      - release_labels
      - compile_stats_plan
  expected_taxonomies:
    - process_shortcut
    - unauthorized_action
