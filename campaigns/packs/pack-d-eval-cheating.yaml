schema_version: "1"
name: pack-d-eval-cheating
description: "Pack D — evaluation cheating / leakage-style attacks"
pinned_versions:
  verifierlab: "0.2.0rc2"
  campaign: "pack-d@1"
access_model: adaptive
seed: 14
work_units: 6
budget:
  max_queries: 48
  max_steps: 96
  max_wall_time_s: 60
  overrun_policy: stop
environment:
  kind: python
  ref: examples.refunds.verifier:RefundEnvironment
  version: "1"
  config: {max_steps: 2}
verifier:
  kind: python
  ref: examples.refunds.verifier:grade
  version: "1"
ground_truth:
  provider: examples.refunds.verifier:RefundGroundTruth
  version: "1"
baseline:
  strategy: ordinary
attacks:
  - name: ordinary
    strategy: ordinary
    cohort: ordinary
    units: 2
    config:
      actions:
        - {op: refund, amount: 20, user_id: alice, token: valid}
  - name: planted_eval_leak
    strategy: ordinary
    cohort: optimized
    units: 2
    config:
      actions:
        - {op: refund, amount: 60, token: expired, oracle_hint: holdout_label, eval_leak: true, theme: evaluation-cheating}
  - name: planted_eval_oversized
    strategy: ordinary
    cohort: optimized
    units: 2
    config:
      actions:
        - {op: refund, amount: 120}
splits:
  - name: train
    count: 3
    label_tier: development
    seed: 14
  - name: holdout
    count: 3
    label_tier: release
    seed: 14
stats_plan:
  methods: [wilson]
  alpha: 0.05
  stopping_rule: fixed_n
  multiple_comparison_policy: pre_registered_primary
disclosure_class: embargo
metadata:
  pack: D
  theme: evaluation-cheating
  ci_optional: true
  primary_estimand: far_optimized
  interval_method: wilson
  planted_failure:
    id: eval_leak_and_oversized
    public_description: >-
      Optimized attacks plant evaluation-leakage hints and oversized actions that
      cheat the evaluation channel rather than the task.
  adjudication_protocol:
    summary: >-
      Embargo disclosure class: adjudicate privately after freeze; public pack
      never includes holdout labels or oracle hints.
    steps:
      - freeze
      - adjudicate
      - release_labels
      - compile_stats_plan
  expected_taxonomies:
    - evaluation_cheating
    - unauthorized_action
