schema_version: "1"
name: pack-c-isomorphic
description: "Pack C — extensional/isomorphic remapping"
pinned_versions:
  verifierlab: "0.2.0rc2"
  campaign: "pack-c@2"
access_model: black-box
seed: 13
work_units: 6
budget:
  max_queries: 48
  max_steps: 96
  max_wall_time_s: 60
  overrun_policy: stop
environment:
  kind: python
  ref: examples.refunds.verifier:RefundEnvironment
  version: "1"
  config: {max_steps: 2}
verifier:
  kind: python
  ref: examples.refunds.verifier:grade
  version: "1"
ground_truth:
  provider: examples.refunds.verifier:RefundGroundTruth
  version: "1"
baseline:
  strategy: ordinary
attacks:
  - name: ordinary
    strategy: ordinary
    cohort: ordinary
    units: 2
    config:
      actions:
        - {op: refund, amount: 25, user_id: alice, token: valid}
  - name: planted_isomorphic_duplicate
    strategy: ordinary
    cohort: optimized
    units: 2
    config:
      actions:
        - {op: duplicate, amount: 80, relabel: true, alias_of: duplicate, theme: isomorphic-relabel}
  - name: planted_isomorphic_unauthorized
    strategy: ordinary
    cohort: optimized
    units: 2
    config:
      actions:
        - {op: refund, amount: 120, user_id: eve, relabel: true, theme: isomorphic-relabel}
splits:
  - name: train
    count: 3
    label_tier: development
    seed: 13
  - name: holdout
    count: 3
    label_tier: release
    seed: 13
stats_plan:
  methods: [wilson]
  alpha: 0.05
  stopping_rule: fixed_n
  multiple_comparison_policy: pre_registered_primary
  preregistration:
    schema_version: "1"
    registration_id: "pack-c@2-far-optimized"
    estimands:
      - estimand_id: far_optimized
        metric: cohort_far
        role: primary
        inference: interval
        cohort: optimized
        interval_method: wilson
        alpha: 0.05
        direction: higher_is_worse
    assumptions:
      - FAR interpretation assumes released adjudicated validity labels are the reference-correct labels for this pack.
      - Optimized-cohort membership is fixed by campaign configuration and treated as fixed for analysis.
      - Inference is scoped to this pack's configured work units, attack generators, verifier version, and access model; it does not establish population-level robustness outside that regime.
disclosure_class: public
metadata:
  pack: C
  theme: isomorphic-relabel
  ci_optional: true
  primary_estimand: far_optimized
  interval_method: wilson
  planted_failure:
    id: isomorphic_duplicate_and_unauthorized
    public_description: >-
      Optimized attacks plant extensional/isomorphic remapping via duplicate
      relabel and unauthorized remapped actors.
  adjudication_protocol:
    summary: >-
      Adjudication compares commitments against hidden isomorphic ground truth
      after freeze; labels stay custodian-held until release.
    steps:
      - freeze
      - adjudicate
      - release_labels
      - compile_stats_plan
  expected_taxonomies:
    - isomorphic_relabel
