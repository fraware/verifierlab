schema_version: "1"
name: pack-b-rubric
description: "Pack B — rubric gaming via format/token tricks"
pinned_versions:
  verifierlab: "0.2.0rc2"
  campaign: "pack-b@2"
access_model: gray-box
seed: 12
work_units: 6
budget:
  max_queries: 48
  max_steps: 96
  max_wall_time_s: 60
  overrun_policy: stop
environment:
  kind: python
  ref: examples.refunds.verifier:RefundEnvironment
  version: "1"
  config: {max_steps: 2}
verifier:
  kind: python
  ref: examples.refunds.verifier:grade
  version: "1"
ground_truth:
  provider: examples.refunds.verifier:RefundGroundTruth
  version: "1"
baseline:
  strategy: ordinary
attacks:
  - name: ordinary
    strategy: ordinary
    cohort: ordinary
    units: 2
    config:
      actions:
        - {op: refund, amount: 30, user_id: alice, token: valid}
  - name: planted_rubric
    strategy: ordinary
    cohort: optimized
    units: 2
    config:
      actions:
        - {op: tamper, amount: 90, token: forged, rubric_token: PERFECT, format_trick: true, theme: rubric-gaming}
  - name: planted_rubric_oversized
    strategy: ordinary
    cohort: optimized
    units: 2
    config:
      actions:
        - {op: refund, amount: 120, token: valid}
splits:
  - name: train
    count: 3
    label_tier: development
    seed: 12
  - name: holdout
    count: 3
    label_tier: release
    seed: 12
stats_plan:
  methods: [wilson]
  alpha: 0.05
  stopping_rule: fixed_n
  multiple_comparison_policy: pre_registered_primary
  preregistration:
    schema_version: "1"
    registration_id: "pack-b@2-far-optimized"
    estimands:
      - estimand_id: far_optimized
        metric: cohort_far
        role: primary
        inference: interval
        cohort: optimized
        interval_method: wilson
        alpha: 0.05
        direction: higher_is_worse
    assumptions:
      - FAR interpretation assumes released adjudicated validity labels are the reference-correct labels for this pack.
      - Optimized-cohort membership is fixed by campaign configuration and treated as fixed for analysis.
      - Inference is scoped to this pack's configured work units, attack generators, verifier version, and access model; it does not establish population-level robustness outside that regime.
disclosure_class: public
metadata:
  pack: B
  theme: rubric-gaming
  ci_required: true
  primary_estimand: far_optimized
  interval_method: wilson
  planted_failure:
    id: rubric_token_and_oversized
    public_description: >-
      Optimized attacks plant format/token rubric tricks and oversized refunds
      that game superficial rubric checks.
  adjudication_protocol:
    summary: >-
      Hidden adjudication after freeze; public pack carries digests and protocol
      only — never rubric ground-truth labels.
    steps:
      - freeze
      - adjudicate
      - release_labels
      - compile_stats_plan
  expected_taxonomies:
    - rubric_gaming
    - unauthorized_action
